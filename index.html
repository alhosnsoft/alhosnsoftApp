
<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الحصن سوفت - تحميل النظام</title>
    <!-- استخدام خط عربي فخم -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            /* خلفية داكنة فخمة بتدرجات لونية */
            background: #0f172a;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        /* تأثيرات الإضاءة في الخلفية */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: float 6s ease-in-out infinite;
        }
        .orb1 { width: 300px; height: 300px; background: rgba(16, 185, 129, 0.4); top: -10%; right: -5%; }
        .orb2 { width: 400px; height: 400px; background: rgba(59, 130, 246, 0.3); bottom: -20%; left: -10%; animation-delay: -3s; }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
            100% { transform: translateY(0px) scale(1); }
        }

        /* البطاقة الزجاجية (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 50px 40px;
            text-align: center;
            max-width: 650px;
            width: 90%;
            z-index: 1;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* السطر الأول: مرحباً بك في */
        h1 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(to left, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.4;
        }

        /* السطر الثاني: اسم الشركة */
        h2 {
            font-size: 24px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 25px;
            line-height: 1.4;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* الكلام الذي تحت */
        p {
            font-size: 18px;
            color: #94a3b8;
            line-height: 1.8;
            margin-bottom: 40px;
            font-weight: 400;
        }

        /* تنسيق خاص لاسم النظام ERP ليكون بارزاً */
        .erp-name {
            display: block;
            font-size: 22px;
            font-weight: 900;
            color: #38bdf8;
            margin: 10px 0;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        /* الزر الفخم */
        .btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 16px 45px;
            text-decoration: none;
            font-size: 20px;
            font-weight: 700;
            border-radius: 50px;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(16, 185, 129, 0.6);
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 25px;
        }

        .feature-item {
            font-size: 14px;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <!-- إضاءات الخلفية -->
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>

    <!-- البطاقة الرئيسية -->
    <div class="glass-card">
        <div class="icon">🚀</div>
       
        <!-- الترتيب الجديد للنصوص -->
        <h1>مرحباً بك في...</h1>
        <h2>شركة الحصن سوفت للحلول البرمجية والمحاسبية</h2>
       
        <p>
            نقدم لك أحدث إصدار من أنظمتنا البرمجية المتكاملة
            <span class="erp-name">نظام الحصن سوفت ERP</span>
            اضغط على الزر أدناه لبدء التحميل والتثبيت الآمن.
        </p>
       
        <!-- ⚠️ هام: غير اسم الملف setup.exe إلى اسم الملف الذي رفعته -->
        <a href="setup.exe" class="btn">تحميل وتثبيت الآن</a>

        <!-- مميزات إضافية -->
        <div class="features">
            <div class="feature-item">✅ تحديثات تلقائية</div>
            <div class="feature-item">🛡️ آمن ومحمي</div>
            <div class="feature-item">⚡ أداء عالي</div>
        </div>

        <div class="footer">
            © 2026 AlhosnSoft. جميع الحقوق محفوظة.
        </div>
    </div>

</body>
</html>
